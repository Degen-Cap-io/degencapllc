[build]
  functions = "netlify/functions"
  publish   = "."

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "DC_SECRET,INVESTOR_PASSWORD,INVESTOR_USERNAME"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
